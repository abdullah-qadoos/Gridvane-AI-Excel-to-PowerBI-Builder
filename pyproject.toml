[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetforge"
version = "0.1.0"
description = "Auditable Excel cleaning and refreshable Power BI projects"
requires-python = ">=3.11,<3.12"
dependencies = ["pandas>=2.2,<4", "openpyxl>=3.1,<4", "pydantic>=2.8,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
llm = ["litellm>=1.70,<2", "keyring>=25,<26"]
validation = ["jsonschema>=4.23,<5"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3", "alembic>=1.15,<2", "pyarrow>=19,<25"]
build = ["pyinstaller>=6.12,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
sheetforge = "sheetforge.cli:main"
pivotra = "sheetforge.cli:main"

[tool.setuptools.packages.find]
include = ["sheetforge*"]

[tool.setuptools.package-data]
sheetforge = ["schemas/*.json", "schemas/*.md", "schemas/**/*.json", "schemas/**/*.md", "web/*", "web/fonts/*", "samples/*.xlsx", "storage/migrations/*.py", "storage/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
